<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CryptoVision AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            CryptoVision AI
        </div>

        <div class="live-status">
            <span class="live-dot"></span>
            LIVE
        </div>

    </nav>

    <section class="hero">

        <h2>BTCUSDT</h2>

        <h1 id="btc-price">$0</h1>

        <p id="btc-change">0%</p>

    </section>

    <section class="main-grid">

        <section class="chart-area">

            <div class="card">

                <h2>Market Chart</h2>

                <canvas id="btcChart"></canvas>

            </div>

        </section>

        <aside class="side-panel">

            <div class="card">

                <h3>Market Status</h3>

                <p id="trend">Loading...</p>

            </div>

            <div class="card">

                <h3>Signal</h3>

                <p id="signal">WAIT</p>

            </div>

            <div class="card">

                <h3>RSI</h3>

                <p id="rsi">0</p>

            </div>

            <div class="card">

                <h3>SMA20</h3>

                <p id="sma20">0</p>

            </div>

            <div class="card">

                <h3>SMA50</h3>

                <p id="sma50">0</p>

            </div>

        </aside>

    </section>

    <section class="ai-section">

        <div class="card">

            <h2>AI Market Analysis</h2>

            <p id="comment">
                Waiting for analysis...
            </p>

        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>

</body>

</html>
